const P={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.5 4 6"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',plus:'<path d="M12 5v14M5 12h14"/>',abs:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>',back:'<path d="M15 18l-6-6 6-6"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',upload:'<path d="M12 3v12M7 8l5-5 5 5M5 21h14"/>',edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const DAYS=['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const CL=['5-B','5-C','5-D','5-E','5-F','5-G'];
const SCH={'5-B':6,'5-C':0,'5-D':1,'5-E':2,'5-F':3,'5-G':4};
const RY=['Makkah 1','Makkah 2','Makkah 3','Sudan 1','Sudan 2','Syanggit 2','Palestin 2'],RYL=['Semua',...RY];
const SUR=['An-Naba',"An-Nazi'at",'Abasa','Al-Fatihah','Al-Baqarah','Ali Imran','An-Nisa','Yasin','Al-Mulk','Al-Ikhlas'];
const AGENDA_PREFIX='AGENDA::';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date(),TD=iso(today),fmt=s=>{const d=new Date(s+'T00:00:00');return DAYS[d.getDay()]+', '+d.getDate()+' '+d.toLocaleString('id-ID',{month:'long'})+' '+d.getFullYear()};
let STU=[];
let S={user:null,mu:[],tp:[],su:[],ses:{},tab:'home'};
const key=(c,d=TD)=>c+'|'+d,stat=c=>{const s=S.ses[key(c)];return s?(s.status==='selesai'?2:1):0};
const BL=['Belum diabsen','Draf','Selesai'];
const isAgenda=clsId=>typeof clsId==='string'&&clsId.startsWith(AGENDA_PREFIX);
const agendaName=clsId=>clsId.replace(AGENDA_PREFIX,'');
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function sheet(html,fn){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${html}</div>`;o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);fn&&fn(o);return o}
function count(root){root.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1200),v=1-Math.pow(1-p,3);e.textContent=Math.round(to*v);if(p<1)requestAnimationFrame(f)})(t0)})}
function pctOf(sid){const s=STU.find(x=>x.id===sid);if(!s)return{h:0,n:0,p:0};let h=0,n=0;Object.values(S.ses).forEach(x=>{if(x.cls===s.cls&&x.status==='selesai'&&x.att[sid]!==undefined){n++;if(x.att[sid]===0)h++}});return{h,n,p:n?Math.round(h/n*100):0}}
function overall(){let h=0,n=0,g=0,fin=0;Object.values(S.ses).forEach(x=>{if(x.status!=='selesai')return;fin++;Object.values(x.att).forEach(v=>{n++;if(v===0)h++;if(v===2)g++})});return{p:n?Math.round(h/n*100):0,fin,g}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadAll(){
  const {data:stds,error:e1}=await sb.from('students').select('*, rayon:rayons(name)').order('name');
  if(e1){toast('Gagal load santri: '+e1.message);return}
  STU=(stds||[]).map(s=>({id:s.id,st:s.stambuk,name:s.name,cls:s.class_id,rayon:s.rayon?.name||'-',kamar:s.kamar,daerah:s.daerah,active:s.is_active}));
  const {data:mu}=await sb.from('muallim').select('name').eq('is_active',true).order('name');
  S.mu=(mu||[]).map(x=>x.name);
  const {data:tp}=await sb.from('places').select('name').eq('is_active',true).order('name');
  S.tp=(tp||[]).map(x=>x.name);
  const {data:su}=await sb.from('surahs').select('name').order('sort_order');
  S.su=(su||[]).map(x=>x.name);
  if(!S.su.length)S.su=[...SUR];
  const {data:sess,error:e2}=await sb.from('sessions').select('*, attendance(student_id,status), muallim:muallim(name), place:places(name), surah:surahs(name)').order('session_date',{ascending:false}).limit(500);
  if(e2){toast('Gagal load sesi: '+e2.message);return}
  S.ses={};
  (sess||[]).forEach(x=>{
    const att={};
    (x.attendance||[]).forEach(a=>{att[a.student_id]=a.status==='hadir'?0:a.status==='izin'?1:2});
    S.ses[x.class_id+'|'+x.session_date]={id:x.id,cls:x.class_id,date:x.session_date,muallim:x.muallim?.name||'',tempat:x.place?.name||'',surah:x.surah?.name||'',a1:x.ayah_from||'',a2:x.ayah_to||'',status:x.status,att};
  });
}

async function getOrCreate(tbl,name){
  if(!name)return null;
  const nm=String(name).trim();
  if(!nm)return null;
  const {data:ex}=await sb.from(tbl).select('id').eq('name',nm).maybeSingle();
  if(ex)return ex.id;
  const {data:cr,error}=await sb.from(tbl).insert({name:nm}).select().single();
  if(error){toast('Gagal buat '+tbl+': '+error.message);return null}
  if(tbl==='muallim'&&!S.mu.includes(nm))S.mu.push(nm);
  if(tbl==='places'&&!S.tp.includes(nm))S.tp.push(nm);
  if(tbl==='surahs'&&!S.su.includes(nm))S.su.push(nm);
  return cr.id;
}

async function saveSession(s,status){
  const muId=await getOrCreate('muallim',s.muallim);

  </div>
</div>
<label class="lbl">${isAg?'Keterangan / Materi':'Materi'}</label>
<div class="grid2" style="grid-template-columns:2fr 1fr 1fr;margin-top:0">
  <input class="inp" id="su" list="dl-su" placeholder="${isAg?'Detail (opsional)':'Surah'}" value="${esc(s.surah||'')}">
  <datalist id="dl-su">${suList.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>
  <input class="inp" id="a1" type="number" min="1" placeholder="Angka" value="${s.a1}">
  <input class="inp" id="a2" type="number" min="1" placeholder="s/d" value="${s.a2}">
</div>
<input class="inp" id="q" placeholder="Cari nama / stambuk" style="margin-top:12px">
<div class="pill" id="fr" style="margin-top:10px">${RYL.map((r,i)=>`<button class="${i?'':'on'}">${r}</button>`).join('')}</div>
<button class="btn alt" id="ah" style="width:100%;margin-top:10px">Semua Hadir</button><div id="rows"></div>
<div class="bar"><div class="prog"><div id="pg"></div></div><div class="cnt"><span style="color:var(--ok)">Hadir <i id="c0">0</i></span><span style="color:var(--iz)">Izin <i id="c1">0</i></span><span style="color:var(--gh)">Ghoib <i id="c2">0</i></span></div><div class="grid2" style="margin-top:0"><button class="btn alt" id="dr">Simpan Draf</button><button class="btn" id="fin">Selesai</button></div></div>`;
  const cnt=()=>{const a=Object.values(s.att);[0,1,2].forEach(i=>{const e=$('#c'+i),n=a.filter(x=>x===i).length;if(e.textContent!=n){e.textContent=n;e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),300)}});$('#pg').style.width=(L.length?a.length/L.length*100:0)+'%'};
  const rows=()=>{$('#rows').innerHTML=L.filter(x=>(ry==='Semua'||x.rayon===ry)&&(x.name.toLowerCase().includes(q)||x.st.includes(q))).map((x,i)=>`<div class="srow" style="animation-delay:${Math.min(i,10)*40}ms"><div class="n">${i+1}. ${esc(x.name)} <small style="color:var(--mu)">(${x.st})</small></div><div class="m">${isAg?`<b style="color:var(--p)">${x.cls}</b> · `:''}${x.rayon} · ${x.kamar} · <a href="#" data-h="${x.id}" style="color:var(--p);font-weight:700;text-decoration:none">Riwayat</a></div><div class="sb" data-id="${x.id}">${['Hadir','Izin','Ghoib'].map((t,j)=>`<button data-st="${j}" class="${s.att[x.id]===j?'on'+j:''}">${t}</button>`).join('')}</div></div>`).join('');cnt()};rows();
  $('#rows').onclick=e=>{const h=e.target.closest('[data-h]');if(h){e.preventDefault();return riwayat(+h.dataset.h,c)}const b=e.target.closest('[data-st]');if(!b)return;const id=+b.parentNode.dataset.id,j=+b.dataset.st;s.att[id]=j;b.parentNode.querySelectorAll('button').forEach((x,i)=>x.className=i===j?'on'+i:'');cnt()};
  $('#bk').onclick=()=>go(isAg?'absen':'home');
  $('#q').oninput=e=>{clearTimeout(absen.t);absen.t=setTimeout(()=>{q=e.target.value.toLowerCase();rows()},300)};
  $('#fr').onclick=e=>{const b=e.target.closest('button');if(!b)return;ry=b.textContent;$('#fr').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));rows()};
  const sync=()=>{s.muallim=$('#mu').value;s.tempat=$('#tp').value;s.surah=$('#su').value;s.a1=$('#a1').value;s.a2=$('#a2').value};
  $('#ah').onclick=async()=>{const all=async()=>{L.forEach(x=>s.att[x.id]=0);rows();await saveSession(s,'draft');toast('Semua ditandai Hadir')};if(Object.keys(s.att).length){const o=sheet('<h3>Timpa pilihan?</h3><p>Semua akan diubah menjadi Hadir.</p><div class="grid2"><button class="btn alt" id="n">Batal</button><button class="btn" id="y">Ya, timpa</button></div>');$('#n',o).onclick=()=>o.remove();$('#y',o).onclick=async()=>{o.remove();await all()}}else await all()};
  $('#dr').onclick=async()=>{sync();const id=await saveSession(s,'draft');if(id){s.status='draft';toast('Tersimpan (Draf)')}};
  $('#fin').onclick=async()=>{
    sync();
    if(Object.keys(s.att).length<L.length)return toast('Masih ada santri tanpa status');
    if(isAg){
      if(!s.muallim)return toast('Isi muallim dulu');
    }else{
      if(!s.muallim||!s.tempat||!s.surah||!s.a1||!s.a2)return toast('Lengkapi muallim, tempat, dan materi');
      if(+s.a1<1||+s.a2<+s.a1)return toast('Ayat tidak valid');
    }
    const id=await saveSession(s,'selesai');
    if(id){s.status='selesai';toast('Tersimpan');recap(k)}
  };
}

function riwayat(id,back){const s=STU.find(x=>x.id===id),p=pctOf(id);const H=Object.values(S.ses).filter(x=>!isAgenda(x.cls)&&x.cls===s.cls&&x.status==='selesai'&&x.att[id]!==undefined).sort((a,b)=>b.date.localeCompare(a.date));
const o=sheet(`<h3>${esc(s.name)}</h3><p>${s.st} · ${s.cls} · ${s.rayon} · ${s.kamar} · ${s.daerah}</p><div class="stats" style="margin:0 0 6px"><div class="stat"><b data-n="${p.p}">0</b><span>% Hadir</span></div><div class="stat"><b data-n="${p.h}">0</b><span>Hadir</span></div><div class="stat"><b data-n="${p.n}">0</b><span>Pertemuan</span></div></div><div style="max-height:40vh;overflow:auto">${H.slice(0,20).map(x=>`<div class="srow"><div class="n" style="display:flex;justify-content:space-between">${fmt(x.date)}<span class="badge ${['b2','b1','b0'][x.att[id]]}" style="${x.att[id]===2?'background:#FEE2E2;color:#B91C1C':''}">${['Hadir','Izin','Ghoib'][x.att[id]]}</span></div><div class="m" style="margin:0">${x.muallim} · ${x.tempat} · ${x.surah} ${x.a1}-${x.a2}</div></div>`).join('')||'<div class="empty">Belum ada riwayat</div>'}</div>`);count(o)}

function recap(k){
  const s=S.ses[k];if(!s)return;
  const g=STU.filter(x=>s.att[x.id]===2),iz=Object.values(s.att).filter(x=>x===1).length;
  const ag=isAgenda(s.cls);
  const dispName=ag?agendaName(s.cls):s.cls;
  const title=ag?`Rekap · ${dispName}`:`Rekap Ghoib · ${s.cls}`;
  const headerLine=ag?`Agenda: ${dispName}`:`Kelas: ${dispName}`;
  const txt=`*REKAP GHOIB${ag?' AGENDA':" TA'LIM QIRO'AH"}*\n5HINE - Gontor 3 Kediri\n${headerLine}\nHari/Tanggal: ${fmt(s.date)}\nMateri: ${s.surah||'-'} ${s.a1?`${s.a1}-${s.a2}`:''}\nMuallim: ${s.muallim||'-'}\nTempat: ${s.tempat||'-'}\n\nGhoib (${g.length}):\n${g.map((x,i)=>`${i+1}. ${x.name}`).join('\n')||'-'}\n\nIzin: ${iz} santri`;
  const v=$('#view');
  v.innerHTML=`<div class="top"><button class="back" id="bk">${ic('back')}</button><h1>${esc(title)}</h1></div><div class="pre">${esc(txt)}</div><div class="grid2"><button class="btn alt" id="cp" style="display:flex;gap:8px;justify-content:center;align-items:center">${ic('copy',18)} Salin</button><button class="btn wa" id="wa" style="display:flex;gap:8px;justify-content:center;align-items:center">${ic('share',18)} Bagikan WA</button></div>`;
  $('#bk').onclick=()=>go('home');
  $('#wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt)}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('Teks disalin')}
}

async function parseFile(file){const n=file.name.toLowerCase();if(/\.(xlsx|xls|csv)$/.test(n)){if(typeof XLSX==='undefined')throw new Error('Library Excel belum siap');const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});return mapSheetRows(rows)}if(n.endsWith('.docx')){if(typeof mammoth==='undefined')throw new Error('Library Word belum siap');const buf=await file.arrayBuffer();const res=await mammoth.extractRawText({arrayBuffer:buf});return parseWordText(res.value)}if(n.endsWith('.doc'))return parseWordText(await file.text());throw new Error('Format tidak didukung')}
function mapSheetRows(rows){if(!rows.length)return[];const H=(rows[0]||[]).map(h=>String(h||'').toLowerCase().trim());const find=(...k)=>{for(let i=0;i<H.length;i++){if(k.some(x=>H[i].includes(x)))return i}return -1};let idx={name:find('nama','name'),st:find('stambuk','nim','nis'),cls:find('kelas','class'),rayon:find('rayon'),kamar:find('kamar','room'),daerah:find('daerah','asal','kota','city')};let start=1;if(idx.name<0){idx={name:0,st:1,cls:2,rayon:3,kamar:4,daerah:5};start=0}const out=[];for(let i=start;i<rows.length;i++){const r=rows[i]||[];const name=String(r[idx.name]??'').trim();if(!name)continue;out.push({_inc:true,name,st:String(r[idx.st]??'').trim()||('IMP-'+Date.now().toString(36).toUpperCase()+'-'+i),cls:String(r[idx.cls]??'').trim()||CL[0],rayon:String(r[idx.rayon]??'').trim()||RY[0],kamar:String(r[idx.kamar]??'').trim()||'-',daerah:String(r[idx.daerah]??'').trim()||'-'})}return out}
function parseWordText(txt){const out=[];txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{if(/nama.*stambuk/i.test(l)&&!/\d/.test(l))return;let parts=l.split(/\t|\||;/).map(x=>x.trim());if(parts.length<2)parts=l.split(',').map(x=>x.trim());if(parts.length<2)return;parts[0]=parts[0].replace(/^\d+[.)]\s*/,'');if(!parts[0])return;out.push({_inc:true,name:parts[0],st:parts[1]||('IMP-'+Date.now().toString(36).toUpperCase()+'-'+i),cls:parts[2]||CL[0],rayon:parts[3]||RY[0],kamar:parts[4]||'-',daerah:parts[5]||'-'})});return out}
function pickFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv,.docx,.doc';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const t=document.createElement('div');t.className='toast';t.textContent='Membaca file...';document.body.appendChild(t);try{const rows=await parseFile(f);t.remove();if(!rows.length)return toast('Tidak ada data terbaca');showPreview(rows,f.name)}catch(e){t.remove();console.error(e);toast('Gagal: '+(e.message||'error'))}};inp.click()}
function showPreview(rows,fname){const usedSt=new Set(STU.map(x=>x.st));const o=sheet(`<h3>Import Data Santri</h3><p><b>${esc(fname)}</b> · ${rows.length} baris</p><div class="pill" style="margin-bottom:10px"><button id="allOn" class="on">Pilih Semua</button><button id="allOff">Kosongkan</button><button id="rmDup">Hapus Duplikat</button></div><div id="impList" style="max-height:48vh;overflow:auto;padding-right:4px"></div><div class="grid2" style="margin-top:14px"><button class="btn alt" id="cancel">Batal</button><button class="btn" id="doImport">Import <span id="nSel">0</span></button></div><p style="font-size:.72rem;margin-top:10px;text-align:center;color:var(--mu)">Kolom: <b>Nama, Stambuk, Kelas, Rayon, Kamar, Daerah</b></p>`);
const listEl=o.querySelector('#impList'),nSelEl=o.querySelector('#nSel');
function render(){listEl.innerHTML=rows.map((r,i)=>`<div class="srow" data-i="${i}" style="${r._inc?'':'opacity:.5'}"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><input type="checkbox" data-inc="${i}" ${r._inc?'checked':''} style="width:20px;height:20px;flex:none;accent-color:var(--p)"><input class="inp" data-f="name" data-i="${i}" value="${esc(r.name)}" placeholder="Nama" style="padding:8px 10px"><span class="badge ${usedSt.has(r.st)?'b1':'b2'}" style="flex:none">${usedSt.has(r.st)?'Dup':'Baru'}</span></div><div class="grid2" style="margin-top:0;gap:6px"><input class="inp" data-f="st" data-i="${i}" value="${esc(r.st)}" placeholder="Stambuk" style="padding:8px 10px"><input class="inp" data-f="cls" data-i="${i}" value="${esc(r.cls)}" placeholder="Kelas" style="padding:8px 10px"><input class="inp" data-f="rayon" data-i="${i}" value="${esc(r.rayon)}" placeholder="Rayon" style="padding:8px 10px"><input class="inp" data-f="kamar" data-i="${i}" value="${esc(r.kamar)}" placeholder="Kamar" style="padding:8px 10px"><input class="inp" data-f="daerah" data-i="${i}" value="${esc(r.daerah)}" placeholder="Daerah" style="padding:8px 10px;grid-column:span 2"></div></div>`).join('');nSelEl.textContent=rows.filter(r=>r._inc).length}
render();
listEl.addEventListener('input',e=>{const f=e.target.dataset.f;if(f)rows[+e.target.dataset.i][f]=e.target.value});
listEl.addEventListener('change',e=>{const inc=e.target.dataset.inc;if(inc!=null){rows[+inc]._inc=e.target.checked;render()}});
o.querySelector('#allOn').onclick=()=>{rows.forEach(r=>r._inc=true);render()};
o.querySelector('#allOff').onclick=()=>{rows.forEach(r=>r._inc=false);render()};
o.querySelector('#rmDup').onclick=()=>{rows.forEach(r=>{if(usedSt.has(r.st))r._inc=false});render()};
o.querySelector('#cancel').onclick=()=>o.remove();
o.querySelector('#doImport').onclick=async()=>{const sel=rows.filter(r=>r._inc&&r.name&&r.st);if(!sel.length)return toast('Tidak ada baris dipilih');const {data:rls}=await sb.from('rayons').select('id,name');const rmap=Object.fromEntries((rls||[]).map(r=>[r.name,r.id]));const inserts=sel.map(r=>({stambuk:r.st,name:r.name,class_id:r.cls,rayon_id:rmap[r.rayon]||null,kamar:r.kamar,daerah:r.daerah}));const {data,error}=await sb.from('students').upsert(inserts,{onConflict:'stambuk'}).select();if(error)return toast('Gagal: '+error.message);o.remove();toast(`Berhasil import ${data.length} santri`);await loadAll();go('santri')}}

function editStudent(id){const s=STU.find(x=>x.id===id);if(!s)return;
const o=sheet(`<h3>Edit Data Santri</h3><p>Ubah lalu simpan.</p><label class="lbl">Nama</label><input class="inp" id="en" value="${esc(s.name)}"><label class="lbl">Stambuk</label><input class="inp" id="es" value="${esc(s.st)}"><div class="grid2"><div><label class="lbl">Kelas</label><select class="inp" id="ec">${CL.map(c=>`<option ${c===s.cls?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="lbl">Rayon</label><select class="inp" id="ey">${RY.map(c=>`<option ${c===s.rayon?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="lbl">Kamar</label><input class="inp" id="ek" value="${esc(s.kamar)}"></div><div><label class="lbl">Daerah</label><input class="inp" id="ed" value="${esc(s.daerah)}"></div></div><div class="grid2" style="margin-top:14px"><button class="btn alt" id="cancel">Batal</button><button class="btn" id="sv">Simpan</button></div><button class="btn alt" id="del" style="width:100%;margin-top:8px;color:var(--gh);box-shadow:inset 0 0 0 2px var(--gh);background:#fff">Hapus Santri</button>`);
o.querySelector('#cancel').onclick=()=>o.remove();
o.querySelector('#sv').onclick=async()=>{const n=o.querySelector('#en').value.trim();const st=o.querySelector('#es').value.trim();if(!n||!st)return toast('Nama & stambuk wajib');const rayonName=o.querySelector('#ey').value;const {data:ry}=await sb.from('rayons').select('id').eq('name',rayonName).maybeSingle();const {error}=await sb.from('students').update({name:n,stambuk:st,class_id:o.querySelector('#ec').value,rayon_id:ry?.id||null,kamar:o.querySelector('#ek').value||'-',daerah:o.querySelector('#ed').value||'-'}).eq('id',id);if(error)return toast('Gagal: '+error.message);s.name=n;s.st=st;s.cls=o.querySelector('#ec').value;s.rayon=rayonName;s.kamar=o.querySelector('#ek').value||'-';s.daerah=o.querySelector('#ed').value||'-';o.remove();toast('Tersimpan');if(S.tab==='santri')V.santri($('#view'))};
o.querySelector('#del').onclick=()=>{const c=sheet(`<h3>Hapus santri?</h3><p><b>${esc(s.name)}</b> akan dihapus permanen.</p><div class="grid2"><button class="btn alt" id="n">Batal</button><button class="btn" id="y" style="background:var(--gh)">Hapus</button></div>`);c.querySelector('#n').onclick=()=>c.remove();c.querySelector('#y').onclick=async()=>{const {error}=await sb.from('students').delete().eq('id',id);if(error)return toast('Gagal: '+error.message);const i=STU.findIndex(x=>x.id===id);if(i>=0)STU.splice(i,1);c.remove();o.remove();toast('Terhapus');if(S.tab==='santri')V.santri($('#view'))}}}

// ==================== PWA INSTALL HANDLER ====================
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  document.querySelectorAll('#installBarLogin,#installBarHome').forEach(el=>{if(el)el.style.display='flex'});
});
function bindInstall(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.onclick=async()=>{
    if(!deferredPrompt){toast('Buka menu browser → Install app');return}
    deferredPrompt.prompt();
    const {outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted')toast('Aplikasi berhasil dipasang');
    deferredPrompt=null;
    document.querySelectorAll('#installBarLogin,#installBarHome').forEach(el=>{if(el)el.style.display='none'});
  };
  if(deferredPrompt)el.style.display='flex';
}
window.addEventListener('appinstalled',()=>{
  toast('Terima kasih! Aplikasi sudah dipasang');
  deferredPrompt=null;
  document.querySelectorAll('#installBarLogin,#installBarHome').forEach(el=>{if(el)el.style.display='none'});
});

(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    const {data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
    if(prof){S.user={id:session.user.id,role:prof.role,name:prof.name};await loadAll();shell();return}
  }
  login();
})();
</script>
